---
# tasks file for simple-apache
- name: install firewall, python3-firewall and httpd
  ansible.builtin.dnf:
    name:
      - httpd
      - firewalld
      - python3-firewall
    state: present

- name: Enable and start httpd & firewalld
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - httpd
    - firewalld

- name: Permanently enable http service, also enable it immediately if possible
  ansible.posix.firewalld:
    service: http
    permanent: true
    state: enabled
    immediate: true

- name: Template a file to /var/www/html
  ansible.builtin.template:
    src: templates/index.html.j2
    dest: /var/www/html/index.html
  notify: Restart apache